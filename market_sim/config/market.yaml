# Phase 25: Patente nur für Hersteller-Stufen (Smart Factory, Hefezucht, Mehrweg,
# alkoholfreies Produkt, neue Geschmacksrichtung), Kühlkette und Kommissionier-Roboter.
# Wer zuerst erforscht, kann für 3 bis 5 Jahre patentieren; andere dürfen forschen,
# aber nicht umsetzen (ausser sie haben schon vorher umgesetzt). Keine Lizenzen.
patents:
  enabled: true
  min_years: 3
  max_years: 5
  base_fee: 2000000
  fee_per_year: 1000000
  cash_cover: 2.0
  rich_cash_multiple: 20.0
  long_archetypes: [premium]
  short_archetypes: [low_cost]
  # Phase 26: «willige» Firmen setzen eine fremd patentierte Stufe trotzdem um, wenn der
  # erwartete Vorteil die geschätzte Strafe übersteigt. Bei Entdeckung: Busse an den Staat,
  # Schadenersatz an den Patentinhaber (mindestens min_damages), Wirkung weg, Reputation sinkt.
  infringement:
    enabled: true
    detection_probability: 0.5
    fine_fixed: 3000000
    fine_revenue_share: 0.01
    min_damages: 5000000
    advantage_per_effect: 0.2
    reputation_hit: 0.05
    belief_spread: 0.5

# Phase 10: marketing builds awareness (0..1) of brands and stores; it fades every year.
marketing:
  enabled: true
  budget_share: {premium: 0.015, growth: 0.012, standard: 0.008, reliable: 0.006, low_cost: 0.003}
  effect_per_chf: 0.00000002
  decay_per_year: 0.3
  start_awareness: 0.5
  brand_weight: 0.4
  store_weight: 0.3
  age_sensitivity: {"18-34": 1.3, "35-64": 1.0, "65+": 0.7}

# Phase 10: restaurants and bars buy from wholesalers and sell out of home.
restaurants:
  enabled: true
  out_of_home_share: 0.15
  age_factor: {"18-34": 1.4, "35-64": 1.0, "65+": 0.6}
  income_step: 0.1
  markup: 3.0
  service_cost_share: 0.5
  fixed_cost_factor: 1.3
  spill_to_stores: 0.5
  # Restaurants and stores compete for the same customers. 60 % of the guests go out
  # anyway; the others compare the restaurant price with the store price.
  price_elasticity: 1.0
  loyal_share: 0.6

# Phase 10: minority stakes; dividends flow to the owners, antitrust counts big stakes.
# Phase 40/41: Übernahme = Holding mit Töchtern statt Eingliedern (enabled: false = altes Eingliedern).
holding_groups:
  enabled: true
  reserve_years: 3
  reserve_share: 0.15
  sweep_tax: 0.03
  min_reserve_share: 0.10
  cover_cash_share: 0.5
  sale_loss_years: 3
  sale_revenue_factor: 0.2
  holding_takeovers: true

# Phase 43: Fusionen (zwei Firmen werden ohne Geldfluss zu einer neuen; enabled: false = aus).
mergers:
  enabled: true
  max_per_year: 1
  base_probability: 0.015
  weak_multiplier: 4.0
  weak_margin: 0.02
  min_size_ratio: 0.3333
  min_share_gain: 0.02
  fixed_saving_min: 0.10
  fixed_saving_max: 0.15
  integration_cost_share: 0.10
  efficiency_loss: 0.05
  max_market_share: 0.40
  double_name_ratio: 0.6

holdings:
  enabled: true
  min_stake: 0.02
  max_stake: 0.49
  buy_probability: 0.3
  cash_cover: 2.0
  profit_multiple: 4.0
  payout_ratio: 0.5
  sell_after_loss_years: 2
  # Phase 18: kleine Beteiligungen (unter 10 %) nur über die Börse und die Hausbank (Gebühr, Depot);
  # grosse Beteiligungen direkt, bei fehlendem Geld mit Kredit der Hausbank.
  via_bank: true
  small_stake_limit: 0.10
  broker_fee: 0.005
  control_premium: 0.2
  price_impact: 0.5
  antitrust_stake: 0.25

# Phase 10: new laws at random times. Firms are not told the effect; the dashboard only
# reports an effect once it is clearly larger than the normal fluctuation before the law.
laws:
  enabled: true
  min_years_after: 3
  window_years: 5
  clear_effect_sigma: 2.0
  laws:
    - {name: mindestlohn, title_de: Mindestlohn, kind: minimum_wage, probability_per_year: 0.04, earliest_year: 8, strength: 1.05, watch: [margin_retailer, margin_wholesaler]}
    - {name: alkoholsteuer, title_de: Höhere Alkoholsteuer auf Spirituosen, kind: excise, category: spirits, probability_per_year: 0.04, earliest_year: 8, strength: 0.25, watch: [share_spirits, margin_factory]}
    - {name: werbeverbot, title_de: Werbeverbot für Spirituosen, kind: ad_ban, category: spirits, probability_per_year: 0.03, earliest_year: 10, watch: [share_spirits]}
    - {name: mehrwegpflicht, title_de: Mehrwegpflicht für Flaschen, kind: packaging, probability_per_year: 0.03, earliest_year: 10, strength: 0.15, watch: [margin_factory, average_customer_price]}
    - {name: kontrollen, title_de: Strengere Kontrollen, kind: controls, probability_per_year: 0.04, earliest_year: 6, strength: 1.5, watch: [offences, offences_detected]}
    - {name: importzoll, title_de: Höherer Importzoll, kind: import_tariff, probability_per_year: 0.03, earliest_year: 10, strength: 0.10, watch: [share_wine, margin_factory]}

# Phase 11: regional labour markets. Hiring needs free workers in the firm's region;
# tight markets push wages up, and firms paying clearly less lose staff to the best payer.
labor:
  enabled: true
  initial_slack: 0.8
  tight_threshold: 0.95
  wage_pressure: 0.15
  wage_relief: 0.05
  wage_index_min: 0.9
  wage_index_max: 1.2
  poach_gap: 0.05
  poach_rate: 0.05

# Phase 12: local Ollama model (nothing leaves this computer). Texts are only written with
# `python -m market_sim.dashboard --texts`; the chat needs `python -m market_sim.serve`.
# A larger model such as qwen2.5:7b writes better German but must be downloaded first.
ollama:
  # api = SwissAI (GLM-5.3, gratis, schneller); ollama = lokales Modell, nichts verlässt den Rechner.
  provider: api
  api_base_url: https://api.swissai.svc.cscs.ch/v1
  # Umgebungsvariable mit dem Schlüssel (nie den Schlüssel selbst hier eintragen).
  api_key_env: SWISSAI_RESEARCH_API_KEY
  api_story_model: CSCS-Inference/zai-org/GLM-5.3
  api_chat_model: CSCS-Inference/zai-org/GLM-5.3
  requests_per_minute: 12
  # GLM denkt sonst vor jeder Antwort nach und verbraucht dabei alle Tokens.
  api_reasoning_effort: low
  host: http://localhost:11434
  story_model: llama3.2:3b
  chat_model: llama3.2:3b
  timeout_seconds: 180
  temperature: 0.2
  max_tokens: 400
