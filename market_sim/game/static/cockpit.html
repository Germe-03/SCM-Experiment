<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Firmen-Cockpit</title>
  <script>
    try {
      const theme = localStorage.getItem('cockpit-theme');
      if (theme === 'hell' || theme === 'dunkel') {
        document.documentElement.dataset.theme = theme === 'hell' ? 'light' : 'dark';
      }
    } catch (error) {
    }
  </script>
  <link rel="stylesheet" href="cockpit.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script src="cockpit_diagramme.js"></script>
  <script src="cockpit_choices.js"></script>
  <script src="cockpit_holding.js"></script>
  <script src="cockpit_berater.js"></script>
  <script src="cockpit_rueckblick.js"></script>
  <script src="reiter_daten.js"></script>
  <script src="reiter_bank.js"></script>
  <script src="reiter_spezial.js"></script>
  <script src="reiter_abschluesse.js"></script>
  <script src="reiter_sortiment.js"></script>
  <script src="reiter_boerse.js"></script>
  <script src="reiter_einkauf.js"></script>
  <script src="reiter_lager.js"></script>
  <script src="cockpit_zusatz.js"></script>
  <script src="cockpit.js" defer></script>
</head>
<body>
  <header id="kopf">
    <h1 id="firmenname"></h1>
    <span id="branche-anzeige"></span>
    <span id="einstufung-anzeige" class="badge" hidden></span>
    <span id="zeit-anzeige"></span>
    <span id="dauer-anzeige" hidden></span>
    <button type="button" id="theme-btn" aria-label="Hell/Dunkel umschalten">◐</button>
    <button type="button" id="speichern-btn">Speichern</button>
    <button type="button" id="neues-spiel-btn">Neues Spiel</button>
  </header>

  <div id="fehler" role="alert" hidden></div>
  <div id="status" role="status" aria-live="polite" hidden></div>

  <main>
    <section id="ansicht-gruendung" hidden>
      <div class="karte">
        <form id="gruendung-form">
          <label for="branche-select">Branche</label>
          <select id="branche-select" name="branch">
            <option value="">Branche wählen</option>
          </select>

          <label for="name-input">Firmenname</label>
          <input id="name-input" name="name" type="text" maxlength="40" required>

          <label id="region-wrap" for="region-select">
            Region
            <select id="region-select" name="region">
              <option value="">Region wählen</option>
            </select>
          </label>

          <label id="dauer-wrap" for="dauer-select">
            Spieldauer
            <select id="dauer-select" name="years">
              <option value="10">10 Jahre</option>
            </select>
          </label>

          <label id="kategorie-wrap" for="kategorie-select">
            Kategorie
            <select id="kategorie-select" name="category">
              <option value="">Kategorie wählen</option>
            </select>
          </label>

          <button type="submit" id="gruenden-btn">Firma gründen</button>
        </form>
      </div>

      <div class="karte">
        <h2>Spielstände</h2>
        <ul id="spielstaende-liste"></ul>
        <p id="keine-spielstaende" hidden>Noch keine Spielstände.</p>
      </div>
    </section>

    <section id="ansicht-cockpit" hidden>
      <nav id="reiterleiste" class="reiter-leiste" role="tablist" aria-label="Bereiche">
        <button type="button" class="reiter-btn" role="tab" data-tab="uebersicht">Übersicht</button>
        <button type="button" class="reiter-btn" role="tab" data-tab="firma">Firma</button>
        <button type="button" class="reiter-btn" role="tab" data-tab="markt">Markt</button>
        <button type="button" class="reiter-btn" role="tab" data-tab="forschung">Forschung</button>
        <button type="button" class="reiter-btn" role="tab" data-tab="logistik">Logistik</button>
        <button type="button" class="reiter-btn" role="tab" data-tab="einkauf">Einkauf</button>
        <button type="button" class="reiter-btn" role="tab" data-tab="lager">Lager</button>
        <button type="button" class="reiter-btn" role="tab" data-tab="finanzen">Finanzen</button>
        <button type="button" class="reiter-btn" role="tab" data-tab="bank">Bank</button>
        <button type="button" class="reiter-btn" role="tab" data-tab="abschluesse">Abschlüsse</button>
        <button type="button" class="reiter-btn" role="tab" data-tab="boerse">Börse</button>
        <button type="button" class="reiter-btn" role="tab" data-tab="rohstoffe">Rohstoffe</button>
        <button type="button" class="reiter-btn" role="tab" data-tab="bevoelkerung">Bevölkerung</button>
        <button type="button" class="reiter-btn" role="tab" data-tab="holding">Holding</button>
        <button type="button" class="reiter-btn" role="tab" data-tab="graubereich">Graubereich</button>
        <button type="button" class="reiter-btn" role="tab" data-tab="hilfe">Hilfe</button>
      </nav>

      <div class="cockpit-raster">
        <div class="haupt">
          <section id="tab-uebersicht" class="reiter-inhalt" role="tabpanel" hidden></section>
          <section id="tab-firma" class="reiter-inhalt" role="tabpanel" hidden></section>
          <section id="tab-markt" class="reiter-inhalt" role="tabpanel" hidden></section>
          <section id="tab-forschung" class="reiter-inhalt" role="tabpanel" hidden></section>
          <section id="tab-logistik" class="reiter-inhalt" role="tabpanel" hidden></section>
          <section id="tab-einkauf" class="reiter-inhalt" role="tabpanel" hidden></section>
          <section id="tab-lager" class="reiter-inhalt" role="tabpanel" hidden></section>
          <section id="tab-finanzen" class="reiter-inhalt" role="tabpanel" hidden></section>
          <section id="tab-bank" class="reiter-inhalt" role="tabpanel" hidden></section>
          <section id="tab-abschluesse" class="reiter-inhalt" role="tabpanel" hidden></section>
          <section id="tab-boerse" class="reiter-inhalt" role="tabpanel" hidden></section>
          <section id="tab-rohstoffe" class="reiter-inhalt" role="tabpanel" hidden></section>
          <section id="tab-bevoelkerung" class="reiter-inhalt" role="tabpanel" hidden></section>
          <section id="tab-holding" class="reiter-inhalt" role="tabpanel" hidden>
            <section id="holding-bereich" class="karte" aria-label="Holding"></section>
          </section>
          <section id="tab-graubereich" class="reiter-inhalt" role="tabpanel" hidden></section>
          <section id="tab-hilfe" class="reiter-inhalt" role="tabpanel" hidden></section>
        </div>

        <aside id="meldungen" class="karte">
          <h2>Meldungen</h2>
          <div class="filter" role="group" aria-label="Filter">
            <button type="button" class="filter-btn aktiv" data-filter="alle">Alle</button>
            <button type="button" class="filter-btn" data-filter="eigen">Eigene</button>
            <button type="button" class="filter-btn" data-filter="markt">Markt</button>
          </div>
          <ul id="meldungen-liste"></ul>
          <section id="berater" aria-label="Berater">
            <h2>Berater</h2>
            <p class="hinweis">Ein Sprachmodell gibt Tipps. Es sieht nur deine Zahlen und Öffentliches und entscheidet nichts selbst.</p>
            <textarea id="berater-frage" rows="2" maxlength="500" placeholder="Frage (freiwillig), z.B. Soll ich den Preis senken?"></textarea>
            <button type="button" id="berater-btn">Berater fragen</button>
            <div id="berater-antwort" aria-live="polite"></div>
          </section>
        </aside>
      </div>

      <div id="spielende" class="karte" hidden>
        <h2 id="spielende-titel"></h2>
        <p id="spielende-text"></p>
        <div id="dashboard-bereich" class="dashboard-bereich" hidden>
          <p id="dashboard-status" role="status"></p>
          <a id="dashboard-link" class="primaer dashboard-link" href="/dashboard" target="_blank" rel="noopener" hidden>Dashboard öffnen</a>
        </div>
        <button type="button" id="neu-btn" class="primaer">Neues Spiel</button>
      </div>

      <footer id="fussleiste" class="fussleiste">
        <span id="geplant-zaehler" class="geplant-zaehler" hidden></span>
        <div class="aktionen">
          <button type="button" id="runde-btn" class="primaer">Runde beenden</button>
          <button type="button" id="weiter-btn">Wie bisher weiter</button>
          <button type="button" id="jahr-btn">Rest des Jahres überspringen</button>
          <button type="button" id="verkaufen-btn" class="gefahr">Firma verkaufen</button>
        </div>
      </footer>
    </section>
  </main>

  <dialog id="bestaetigen-dialog">
    <p id="bestaetigen-text"></p>
    <button type="button" id="bestaetigen-ja" class="gefahr">Ja</button>
    <button type="button" id="bestaetigen-nein">Abbrechen</button>
  </dialog>

  <dialog id="check-dialog">
    <h2>Bist du sicher?</h2>
    <ul id="check-liste"></ul>
    <button type="button" id="check-ja" class="gefahr">Trotzdem beenden</button>
    <button type="button" id="check-nein">Zurück</button>
  </dialog>

  <dialog id="speichern-dialog">
    <form method="dialog">
      <label for="speichern-name">Name des Spielstands</label>
      <input id="speichern-name" type="text" maxlength="40">
      <button id="speichern-ok" value="ok">Speichern</button>
      <button value="abbruch" formnovalidate>Abbrechen</button>
    </form>
  </dialog>
</body>
</html>
