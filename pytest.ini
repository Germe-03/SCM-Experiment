[pytest]
# The default .pytest_cache dir hits WinError 5 (ACL-locked) on this machine,
# so redirect the cache into the writable, gitignored temp dir.
cache_dir = .pytest_tmp/cache
# Run outputs and temp folders (some are ACL-locked by sandboxed tools) are not tests.
norecursedirs = runs .tmp .pytest_tmp .test_tmp* pytest_*tmp .venv team_bundle
