# What-if scenarios for forks from a year-end checkpoint. Every change is
# applied once at the fork year and stays active for the rest of the run.
# kinds: demand (consumer demand), capacity (production capacity of a stage),
# price (annual price band of a stage, clamped to the stage price band).

nachfrage_einbruch:
  description: Die Konsumnachfrage nach Bier sinkt dauerhaft um 20 %.
  changes:
    - {kind: demand, factor: 0.80}

brauerei_engpass:
  description: Beide Brauereien verlieren 30 % ihrer Produktionskapazität (z. B. Hopfenknappheit).
  changes:
    - {kind: capacity, stage: factory, factor: 0.70}

preiserhoehung_brauerei:
  description: Beide Brauereien erhöhen ihre Verkaufspreise um 20 %.
  changes:
    - {kind: price, stage: factory, factor: 1.20}
