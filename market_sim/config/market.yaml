market_entry:
  enabled: true
  base_probability: 0.08
  shortage_capacity_ratio: 1.1
  margin_threshold: 0.05
  margin_slope: 2.0
  max_probability: 0.5
  max_firms_per_stage: {retailer: 14, wholesaler: 9, distributor: 6, factory: 9}
  start_cash_fraction: 0.5
  start_capacity_fraction: 0.5
  start_reputation: [0.40, 0.50]
  start_quality_fraction: 0.9
  names:
    retailer: [Aare Laden, Rigi Markt, Limmat Shop, Emme Markt, Jura Laden, Pilatus Markt, Reuss Shop, Sihl Laden]
    wholesaler: [Helvetia Handel, Aare Handel, Seeland Handel, Rigi Handel, Thur Handel, Linth Handel]
    distributor: [Alpen Logistik, Mittelland Verteilung, Gotthard Vertrieb, Jura Logistik]
    factory: [Aare Brauerei, Rigi Bräu, Emmental Bier, Säntis Brauerei]

bank:
  enabled: true
  base_rate: 0.03
  risk_premium_per_loss_year: 0.01
  leverage_premium: 0.04
  max_rate: 0.15
  deposit_rate: 0.005
  negative_interest_enabled: true
  deposit_threshold_revenue_fraction: 0.5
  deposit_threshold_min: 50000000
  negative_rate: 0.0075
  credit_limit_revenue_fraction: 0.25
  credit_limit_initial_cash_fraction: 1.0
  credit_limit_min: 0.0
  restructuring: true
  restructuring_reputation_hit: 0.10

strategy_change:
  enabled: true
  bad_years_trigger: 2
  explore_probability: 0.2
  imitation_window_years: 3
  lockout_years: 4
  switch_cost_fraction_of_revenue: 0.02
  reputation_dip: 0.05

unit_scale:
  real_units_per_sim_unit: 10000

demand:
  annual_demand_units: 94400
  daily_demand_units: 259
  # Summer seasonality; consumer classes (consumers.yaml) decide who buys what.
  seasonal_amplitude: 0.25
  seasonal_phase_days: 90

# P4b fix: exits are evaluated at year-end after this grace period.
bankruptcy:
  enabled: true
  # Relative to each firm's own starting capital.
  cash_floor_fraction: 1.0
  negative_cash_years: 4
  # A stage never drops below this many active firms.
  min_firms_per_stage: 2
  # Insolvency proceedings take time: at most this many exits per stage and year.
  max_exits_per_stage_per_year: 2
  min_years_before_exit: 1

# Seeded start values: every seed begins with a slightly different market (+/- fraction).
start_variation:
  cash_spread: 0.20
  quality_spread: 0.10
  reputation_spread: 0.15

# Generic yearly market events, deterministic per seed and evaluated in this order.
events:
  enabled: true
  types:
    - type: heat_summer
      enabled: true
      probability_per_year: 0.25
      duration_days: 60
      strength: 1.15
      effect_handler: demand_multiplier
    - type: harvest_failure
      enabled: true
      probability_per_year: 0.20
      duration_days: 365
      strength: 1.30
      effect_handler: material_cost_multiplier
    - type: recall
      enabled: true
      probability_per_year: 0.25
      duration_days: 1
      strength: 0.10
      effect_handler: firm_recall
      reputation_strength: 0.15
      cost: 8000000.0
    # Phase 3: the former what-if scenarios now happen by chance inside the run.
    - type: recession
      enabled: true
      probability_per_year: 0.10
      duration_days: 540
      strength: 0.85
      effect_handler: demand_multiplier
    - type: raw_material_shortage
      enabled: true
      probability_per_year: 0.08
      duration_days: 180
      strength: 0.75
      effect_handler: stage_capacity_multiplier
      stage: factory
    - type: cost_shock
      enabled: true
      probability_per_year: 0.08
      duration_days: 365
      strength: 1.25
      effect_handler: material_cost_multiplier
    - type: wage_push
      enabled: true
      probability_per_year: 0.06
      duration_days: 1
      strength: 1.03
      effect_handler: wage_push

# Empty supplier lists discover every active firm one stage upstream.
supplier_discovery:
  enabled: true

price:
  base: 4.99
  min: 1.40
  # Wide enough for wine and spirits (value factor up to 2.2).
  max: 30.00

# P3 fix: stage-specific bands preserve markup through the supply chain.
stage_prices:
  factory: {base: 2.45, min: 1.40, max: 5.00}
  distributor: {base: 3.20, min: 1.90, max: 7.00}
  wholesaler: {base: 4.10, min: 2.40, max: 9.00}
  retailer: {base: 5.20, min: 2.50, max: 12.00}

simulation:
  years: 50
  days_per_year: 365

logistics:
  default_lead_time_days: 2

costs:
  # P4a tunable defaults, in real CHF per sim-unit per day.
  holding_cost_per_unit: 27.0
  backlog_cost_per_unit: 250.0
  # Demand-v2 tunable calibration knob, real CHF per sim-unit shipped/sold.
  handling_cost_per_unit: 1500.0
  # One simulated employee / R&D franc stands for this many real ones.
  personnel_cost_scale: 80.0
  # Starting capital on the same money scale as the scaled revenue.
  initial_cash_scale: 36.0

# Rent, vehicles and machines, real CHF per day; grows with capacity.
fixed_costs:
  base_per_day: {factory: 55000.0, distributor: 12000.0, wholesaler: 12000.0, retailer: 18000.0}
  per_capacity_unit_per_day: {factory: 1820.0, distributor: 3700.0, wholesaler: 3500.0, retailer: 3300.0}

# Raw materials per produced sim-unit (real CHF); each index fluctuates over time.
commodities:
  components: {malt: 6300.0, hops: 1700.0, packaging: 6000.0, energy: 1800.0}
  index_volatility: 0.08
  index_mean_reversion: 0.2
  index_update_days: 30

# S7 tunable guesses: calibrate these coefficients against observed firm data.
workforce:
  days_per_month: 30
  overtime_capacity_coeff: 1.0
  overtime_wage_premium: 1.5
  base_annual_turnover: 0.08
  overtime_turnover_coeff: 0.5
  wage_reference: 5000.0
  wage_turnover_coeff: 0.5
  hiring_cost_per_employee: 2500.0
  productivity_churn_penalty: 1.0
  min_employees: 1

# S7 tunable guesses: R&D effects are deliberately delayed and small.
rnd:
  lag_days: 365
  effect_per_chf: 0.000001
  quality_cap: 0.98
  daily_quality_decay: 0.000005

# Feedback-link: service, product quality, wages, and price stability build trust.
reputation:
  reputation_adjust_speed: 0.3
  service_weight: 0.4
  quality_weight: 0.4
  wage_weight: 0.2
  price_volatility_penalty: 0.5
  price_volatility_floor: 0.7

# Feedback-link: realized annual fill rate becomes earned supplier reliability.
reliability:
  reliability_adjust_speed: 0.4

# Feedback-link: sustained operation above the threshold reduces product quality.
capacity:
  overload_utilization_threshold: 0.90
  overload_quality_penalty: 0.30

# P1 fix: safety cap for daily replenishment orders.
policy:
  max_order_demand_multiple: 3.0
  # Open orders older than this many days of supplier capacity are cancelled.
  max_backlog_days: 10
  # P2 fix: exponent applied to supplier scores when splitting orders.
  concentration: 12.0
  # Multiplier for the factor named by each firm's supplier priority.
  supplier_priority_boost: 50.0

# Adaptive strategy: small deterministic year-to-year learning steps.
adaptive_strategy:
  price_step_fraction: 0.01
  max_price_step_fraction: 0.04
  competitive_pull: 0.30
  undercut_fraction: 0.05
  share_loss_trigger: 0.01
  rnd_min_multiplier: 0.55
  rnd_max_multiplier: 1.80
  rnd_step_multiplier: 0.10
  safety_stock_min_days: 4
  safety_stock_max_days: 18
  max_hires_per_year: 3

supplier_score_weights:
  price: 0.30
  reliability: 0.20
  quality: 0.20
  reputation: 0.15
  lead_time: 0.05
  capacity: 0.10

# Phase 3: long runs. Money values drift with inflation, wages grow a little faster
# than prices, productivity offsets that, the population ages, trends come and go.
long_run:
  enabled: true
  inflation_mean: 0.01
  inflation_sd: 0.008
  inflation_min: -0.01
  inflation_max: 0.04
  real_wage_growth: 0.005
  productivity_growth: 0.005
  population_growth: {"18-34": 0.001, "35-64": 0.003, "65+": 0.012}
  trend_years: [3, 8]
  trend_transition_years: 2
  trends:
    - {name: craft_welle, trait: craft, strength: 0.30, age_groups: ["18-34", "35-64"]}
    - {name: alkoholfrei, trait: alkoholfrei, strength: 0.40}
    - {name: sparwelle, trait: discount, strength: 0.25}
    - {name: tradition, trait: lager, strength: 0.15, age_groups: ["35-64", "65+"]}
    - {name: wein_boom, trait: wine, strength: 0.30}

# Phase 4: a fixed alcohol need split over beer, wine and spirits (units are standard
# drinks), wineries with harvest and maturation, a distillery, importers and exports.
categories:
  enabled: true
  categories:
    - {name: beer, value_factor: 1.0, relative_volume: 1.0, income_tilt: 0.95}
    - {name: wine, value_factor: 1.6, relative_volume: 0.35, income_tilt: 1.25}
    - {name: spirits, value_factor: 2.2, relative_volume: 0.12, income_tilt: 1.05}
  # Consumers switch to another category only when theirs is gone; score x this factor.
  substitution: 0.5
  # Retail, wholesale and distribution grow to carry the extra wine and spirits volume.
  downstream_capacity_factor: 1.47
  # Calibrated so that system profit stays at 5-15 % of consumer revenue.
  handling_cost_factor: 1.53
  retailer_bias:
    premium: {beer: 0.35, wine: 0.45, spirits: 0.20}
    low_cost: {beer: 0.80, wine: 0.15, spirits: 0.05}
    standard: {beer: 0.68, wine: 0.24, spirits: 0.08}
    reliable: {beer: 0.68, wine: 0.24, spirits: 0.08}
    growth: {beer: 0.70, wine: 0.20, spirits: 0.10}
  bias_weight: 0.3
  harvest_day: 270
  yield_sd: 0.15
  vintage_quality_slope: 0.3
  wine_forecast_buffer: 1.1
  fx_start: 1.0
  fx_sd: 0.06
  fx_reversion: 0.3
  imports: {cost_factor: 0.75, tariff: 0.05, lead_days: 10}
  exports:
    enabled: true
    share: {beer: 0.04, wine: 0.03, spirits: 0.05}
    fx_elasticity: 1.5
    quality_threshold: 0.6
    world_price_factor: 1.0

# Phase 5: eight regions (population shares 2023, rounded), transport by own fleet or a
# transport service, capacity expansion and new store sites with construction time.
geography:
  enabled: true
  regions:
    - {name: genfersee, population_share: 0.195, x: 538, y: 152}
    - {name: bern, population_share: 0.120, x: 600, y: 200}
    - {name: jura_freiburg, population_share: 0.090, x: 561, y: 205}
    - {name: nordwestschweiz, population_share: 0.135, x: 611, y: 267}
    - {name: zuerich, population_share: 0.185, x: 683, y: 248}
    - {name: ostschweiz, population_share: 0.130, x: 746, y: 254}
    - {name: zentralschweiz, population_share: 0.100, x: 666, y: 211}
    - {name: tessin, population_share: 0.045, x: 717, y: 96}
  road_factor: 1.25
  local_km: 20
  own_rate: 1.0
  service_rate: 1.4
  damage_probability: 0.01
  damage_share: 0.05
  risk_aversion: 2.0
  fleet_cost_per_day: 3000
  fuel_volatility: 0.10
  km_per_lead_day: 100
  travel_km: 40
  build_cost_per_capacity_unit: {retailer: 3600000, wholesaler: 3800000, distributor: 4000000, factory: 2000000}
  build_days: {retailer: 180, wholesaler: 270, distributor: 270, factory: 540}
  depreciation_years: 10
  expand_utilization: 0.95
  # The whole stage must be this busy before anyone builds.
  stage_utilization_min: 0.85
  expand_fraction: 0.20
  cash_cover: 2.0
  site_fraction: 0.30
  site_coverage_gap: 0.70

# Phase 6: the state. True detection rates and fines are hidden from the firms; some
# offences pay off because the fine is smaller than the gain. Cigarettes: not built (TODO).
state:
  enabled: true
  profit_tax: 0.15
  reputation_value_factor: 0.5
  offences:
    - {name: lohndumping, kind: wage, benefit: 0.08, detection_probability: 0.15, fine_fixed: 2000000, fine_revenue_share: 0.005, reputation_hit: 0.08}
    - {name: pfusch, kind: material, benefit: 0.10, detection_probability: 0.20, fine_fixed: 5000000, fine_revenue_share: 0.02, reputation_hit: 0.15}
    - {name: steuerhinterziehung, kind: tax, benefit: 0.60, detection_probability: 0.10, fine_fixed: 1000000, fine_revenue_share: 0.003, reputation_hit: 0.05}
  belief_spread: 1.0
  aversion: 1.0
  learning_rate: 0.3
  public_learning: 0.2
  poisoning_probability: 0.01
  poisoning_deaths: 40
  poisoning_sick: 1500
  fear_strength: 0.15
  fear_half_life_years: 1.0
  category_reputation_hit: 0.2
  distress_fraction: 0.6
  distress_loss_years: 2
  price_per_capacity_unit: 1500000
  cash_cover: 1.5
  max_takeovers_per_stage: 1
  block_share: 0.35
  breakup_share: 0.5
  breakup_fraction: 0.3

# Phase 7: research projects. Expensive, slow and uncertain; firms pick projects that
# fit their archetype. The yearly R&D budget (rnd block) keeps working as before.
research:
  enabled: true
  start_probability: 0.30
  cash_cover: 3.0
  projects:
    - {name: prozessautomation, kind: productivity, cost: 60000000, duration_days: 540, success_probability: 0.6, effect: 0.15}
    - {name: rezeptur_optimierung, kind: cost_reduction, cost: 50000000, duration_days: 365, success_probability: 0.5, effect: 0.08, stages: [factory]}
    - {name: neue_marke, kind: new_brand, cost: 80000000, duration_days: 730, success_probability: 0.4, effect: 0.10, stages: [factory]}
    - {name: alkoholfreies_bier, kind: alkoholfrei, cost: 70000000, duration_days: 540, success_probability: 0.5, stages: [factory]}
    # New efficiency projects complement, rather than crowd out, capacity research.
    - {name: leichtere_flaschen, enabled: true, selection_weight: 0.25, kind: component_reduction, component: packaging, cost: 40000000, duration_days: 365, success_probability: 0.7, effect: 0.15, stages: [factory]}
    - {name: waermerueckgewinnung, enabled: true, selection_weight: 0.25, kind: component_reduction, component: energy, cost: 60000000, duration_days: 540, success_probability: 0.6, effect: 0.20, stages: [factory]}
    - {name: ausbeute_optimierung, enabled: true, selection_weight: 0.25, kind: component_reduction, component: malt, cost: 30000000, duration_days: 365, success_probability: 0.5, effect: 0.08, stages: [factory]}
    - {name: routenplanung, enabled: true, selection_weight: 0.25, kind: transport_efficiency, cost: 30000000, duration_days: 365, success_probability: 0.7, effect: 0.15, stages: [wholesaler, distributor, factory]}
    - {name: lagerautomation, enabled: true, selection_weight: 0.25, kind: storage_automation, cost: 50000000, duration_days: 540, success_probability: 0.6, effect: 0.25}
    - {name: robotik, enabled: true, selection_weight: 0.25, kind: robotics, cost: 80000000, duration_days: 730, success_probability: 0.4, effect: 0.25}
  preferences:
    premium: [neue_marke, alkoholfreies_bier, leichtere_flaschen]
    low_cost: [rezeptur_optimierung, prozessautomation, robotik, ausbeute_optimierung, waermerueckgewinnung]
    growth: [prozessautomation, alkoholfreies_bier, robotik, routenplanung]
    standard: [prozessautomation, rezeptur_optimierung, leichtere_flaschen, lagerautomation]
    reliable: [prozessautomation, routenplanung, lagerautomation]
